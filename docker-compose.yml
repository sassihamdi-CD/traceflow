# Pilot clone-and-run: `cp .env.example .env` then `docker compose up --build`.
# API waits for Postgres (service_healthy) and applies migrations automatically.
# Web console (Next.js) is built from ./web and served on ${WEB_PORT:-3000};
# NEXT_PUBLIC_* keys are baked in at build time, so re-run with --build
# after changing keys in .env.
# NOTE: no top-level `name:` key — keeps this file working with both
# `docker compose` (v2) and the older standalone `docker-compose` (v1).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: traceflow
      POSTGRES_USER: traceflow_app
      POSTGRES_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceflow_app -d traceflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://traceflow_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}@db:5432/traceflow
    command: bash scripts/migrate.sh
    restart: "no"

  api:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Compose provides the pilot DB; .env supplies Supabase/R2/Claude keys.
      DATABASE_URL: postgresql://traceflow_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}@db:5432/traceflow
      PORT: 8000
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://traceflow_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}@db:5432/traceflow
    command: python scripts/worker.py
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://xyz.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-change-me}
        NEXT_PUBLIC_PILOT_INVITE_CODE: ${NEXT_PUBLIC_PILOT_INVITE_CODE:-change-me}
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
